<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakeboard Booking System</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Sarabun',sans-serif;background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
  .box{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);width:100%;max-width:360px}
  h2{text-align:center;color:#1a73e8;margin-top:0}
  input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;min-height:44px}
  button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:10px;font-size:16px;min-height:44px}
  #msg{color:#d93025;text-align:center;font-size:14px;min-height:18px}
  .link{text-align:center;margin-top:10px;font-size:14px}
  .link a{color:#1a73e8;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h2>🏄 Wakeboard Booking</h2>
  <input type="email" id="email" placeholder="อีเมล">
  <input type="password" id="password" placeholder="รหัสผ่าน">
  <button onclick="login()">เข้าสู่ระบบ</button>
  <p id="msg"></p>
  <div class="link"><a href="register.html">สมัครสมาชิกใหม่</a></div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwZCGZsNFXe02Cjf0c-gMSrQ2yg9s-L-12EosX325t6sb_hPebGlqXF5QM7sB_6uVHA/exec";

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if(!email || !password){ document.getElementById('msg').innerText='กรุณากรอกข้อมูลให้ครบ'; return; }
  
  document.getElementById('msg').innerText='กำลังเข้าสู่ระบบ...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', email, password })
    });
    const result = await res.json();
    if(result.success){
      localStorage.setItem('user', JSON.stringify(result.user));
      if(result.user.role === 'admin') window.location.href = 'admin.html';
      else if(result.user.role === 'teacher') window.location.href = 'teacher.html';
      else window.location.href = 'booking.html';
    } else {
      document.getElementById('msg').innerText = result.message;
    }
  } catch(e) {
    document.getElementById('msg').innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
  }
}
</script>
</body>
</html>
