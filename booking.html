<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking - Wakeboard</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Sarabun',sans-serif;background:#f0f4f8;margin:0;padding:12px}
  .container{max-width:640px;margin:auto;background:#fff;padding:18px;border-radius:12px}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h2{margin:4px 0;color:#1a73e8;font-size:20px}
  input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;min-height:44px}
  .slot{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  button{padding:10px 16px;background:#1a73e8;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;min-height:40px}
  .logout-btn{background:#5f6368;padding:8px 14px;font-size:13px;min-height:36px}
  .tab{cursor:pointer;padding:10px 14px;display:inline-block;font-size:15px}
  .tab.active{border-bottom:3px solid #1a73e8;font-weight:bold}
  .tabs{display:flex;border-bottom:1px solid #eee;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>🏄 จองเวลาเรียน</h2>
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('book',this)">จองคิวใหม่</div>
    <div class="tab" onclick="showTab('history',this)">ประวัติการจอง</div>
  </div>
  <div id="bookTab">
    <input type="date" id="dateInput" onchange="loadSlots()">
    <div id="slotsList"></div>
  </div>
  <div id="historyTab" style="display:none"><div id="historyList"></div></div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwZCGZsNFXe02Cjf0c-gMSrQ2yg9s-L-12EosX325t6sb_hPebGlqXF5QM7sB_6uVHA/exec";
let currentUser = JSON.parse(localStorage.getItem('user')||'null');
if(!currentUser || !currentUser.token || currentUser.role!=='student') window.location.href='index.html';

async function apiFetch(url, opts){
  const body = JSON.parse(opts.body); body.token = currentUser.token;
  const res = await fetch(url, { ...opts, body: JSON.stringify(body) });
  res.clone().json().then(d=>{ if(d && d.code==='AUTH'){ localStorage.removeItem('user'); alert(d.message); window.location.href='index.html'; } }).catch(()=>{});
  return res;
}
function logout(){ localStorage.removeItem('user'); window.location.href='index.html'; }
function showTab(tab,el){
  document.getElementById('bookTab').style.display = tab==='book'?'block':'none';
  document.getElementById('historyTab').style.display = tab==='history'?'block':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(tab==='history') loadHistory();
}

async function loadSlots(){
  const date = document.getElementById('dateInput').value;
  if(!date) return;
  document.getElementById('slotsList').innerHTML='กำลังโหลด...';
  const res = await apiFetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAvailableSlots', date }) });
  const data = await res.json();
  renderSlots(data.slots);
}

function renderSlots(slots){
  const list = document.getElementById('slotsList');
  if(!slots || slots.length===0){ list.innerHTML='<p>ไม่มีคิวว่างในวันนี้</p>'; return; }
  list.innerHTML = slots.map(s=>`
    <div class="slot"><div><b>${s.timeSlot}</b> น. — ครู ${s.teacherName}<br><small>ว่าง ${s.capacity-s.bookedCount} / ${s.capacity} · ราคา ${s.price||0} บาท</small></div>
    <button onclick="openBook('${s.scheduleId}', ${s.price||0})">จอง</button></div>`).join('');
}


async function loadHistory(){
  document.getElementById('historyList').innerHTML='กำลังโหลด...';
  const res = await apiFetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getMyBookings', studentId: currentUser.id }) });
  const data = await res.json();
  renderHistory(data.bookings);
}

function renderHistory(bookings){
  const list = document.getElementById('historyList');
  if(!bookings || bookings.length===0){ list.innerHTML='<p>ยังไม่มีประวัติการจอง</p>'; return; }
  list.innerHTML = bookings.map(b=>`
    <div class="slot"><div>วันที่ ${b.date} เวลา ${b.timeSlot} น. — ครู ${b.teacherName}<br><small>สถานะ: ${b.status} · ${b.price||0} บาท</small></div>
    ${b.hasSlip?`<button onclick="viewSlip('${b.bookingId}')" style="background:#188038">ดูสลิป</button>`:''}${b.status!=='Cancelled'?`<button onclick="cancel('${b.bookingId}')">ยกเลิก</button>`:''}</div>`).join('');
}

async function cancel(bookingId){
  if(!confirm('ยืนยันยกเลิก?')) return;
  const res = await apiFetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cancelBooking', bookingId }) });
  const result = await res.json();
  alert(result.message); if(result.success) loadHistory();
}

// ข้อความแนะนำการโอนเงิน — แก้เป็นเลขบัญชี/พร้อมเพย์ของคุณ
const PAYMENT_NOTE = 'โอนเงินตามยอดด้านบน แล้วแนบรูปสลิปเพื่อยืนยันการจอง (แก้ข้อความนี้เป็นเลขบัญชีหรือพร้อมเพย์ของคุณ)';
let pendingSchedule = null, slipData = null;

function showModal(title, html){ document.getElementById('mTitle').innerText = title; document.getElementById('mBody').innerHTML = html; document.getElementById('modal').style.display = 'block'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }

function openBook(scheduleId, price){
  pendingSchedule = scheduleId; slipData = null;
  showModal('ยืนยันการจอง', `
    <p>ยอดที่ต้องโอน: <b>${price} บาท</b></p>
    <p style="font-size:14px;color:#5f6368">${PAYMENT_NOTE}</p>
    <input type="file" accept="image/*" onchange="pickSlip(this)">
    <img id="slipPreview" style="display:none;max-width:100%;border-radius:8px;margin:6px 0">
    <button id="confirmBtn" onclick="confirmBook()" style="width:100%" disabled>ยืนยันการจอง</button>
    <p id="mMsg" style="color:#d93025;text-align:center;font-size:14px"></p>`);
}

// ย่อรูปในเบราว์เซอร์ก่อนส่ง (ด้านยาวสุด 1280px, JPEG) ให้ไฟล์เล็กและอัปโหลดเร็ว
function pickSlip(input){
  const f = input.files[0]; if(!f) return;
  const msg = document.getElementById('mMsg'); msg.innerText = '';
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    slipData = c.toDataURL('image/jpeg', 0.75);
    const p = document.getElementById('slipPreview'); p.src = slipData; p.style.display = 'block';
    document.getElementById('confirmBtn').disabled = false;
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => { msg.innerText = 'เปิดไฟล์รูปนี้ไม่ได้ กรุณาเลือกรูป JPG หรือ PNG'; };
  img.src = URL.createObjectURL(f);
}

async function confirmBook(){
  const btn = document.getElementById('confirmBtn'), msg = document.getElementById('mMsg');
  btn.disabled = true; msg.innerText = 'กำลังอัปโหลดสลิป...';
  try {
    const res = await apiFetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'createBooking', scheduleId: pendingSchedule, slip: slipData }) });
    const result = await res.json();
    if(result.success){ closeModal(); alert(result.message); loadSlots(); }
    else { msg.innerText = result.message; btn.disabled = false; }
  } catch(e){ msg.innerText = 'เชื่อมต่อไม่ได้ กรุณาลองใหม่'; btn.disabled = false; }
}

async function viewSlip(bookingId){
  showModal('สลิปการโอนเงิน', '<p>กำลังโหลด...</p>');
  try {
    const res = await apiFetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getSlip', bookingId }) });
    const r = await res.json();
    document.getElementById('mBody').innerHTML = r.success ? `<img src="${r.image}" style="max-width:100%;border-radius:8px">` : `<p>${r.message}</p>`;
  } catch(e){ document.getElementById('mBody').innerHTML = '<p>โหลดสลิปไม่สำเร็จ</p>'; }
}
</script>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;padding:16px;overflow:auto">
  <div style="background:#fff;max-width:420px;margin:auto;padding:18px;border-radius:12px">
    <h3 id="mTitle" style="margin:0 0 8px;color:#1a73e8"></h3>
    <div id="mBody"></div>
    <button onclick="closeModal()" style="background:#5f6368;width:100%;margin-top:8px">ปิด</button>
  </div>
</div>
</body>
</html>
